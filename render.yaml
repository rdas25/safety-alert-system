services:
  - type: web
    name: safety-alert-system
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /ready
    envVars:
      - key: RISK_PROFILE
        value: walktest
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: CLIENT_TOKEN
        generateValue: true
      - key: ADMIN_TOKEN
        generateValue: true
      - key: LOG_POSITIONS
        value: "0"
